{{ $title := .Page.Title }}
{{ range .Page.Resources.ByType "image" }}
    {{ $image := . }}
    {{ with .Meta.Exif }}
        <figure>
            <img alt="{{ $title }}" src="{{ $image.RelPermalink }}" loading="lazy" />
            <figcaption>
                {{ .ExposureTime }}s, f/{{ .FNumber.Float64 }}, ISO {{ .ISO }}, {{ .FocalLength }}mm, {{ .Make | humanize }} {{ .Model }}
            </figcaption>
        </figure>
    {{ end }}
{{ end }}
